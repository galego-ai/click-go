name: Native Motorista APK

on:
  push:
    branches: [main]
    paths:
      - 'android-native/motorista/**'
      - '.github/workflows/native-motorista-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-native/motorista/**'
      - '.github/workflows/native-motorista-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLICKGO_FIREBASE_PROJECT_ID: ${{ secrets.CLICKGO_FIREBASE_PROJECT_ID }}
      CLICKGO_FIREBASE_APP_ID: ${{ secrets.CLICKGO_FIREBASE_DRIVER_APP_ID }}
      CLICKGO_FIREBASE_API_KEY: ${{ secrets.CLICKGO_FIREBASE_API_KEY }}
      CLICKGO_FIREBASE_SENDER_ID: ${{ secrets.CLICKGO_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare preview signing key
        run: |
          base64 -d android-native/motorista/app/preview-debug.keystore.b64 > android-native/motorista/app/preview-debug.keystore
      - name: Apply driver PRIME features
        working-directory: android-native/motorista
        run: |
          python3 apply_login_stability_patch.py
          python3 apply_recovery_routing_patch.py
          python3 apply_registration_photo_patch.py
          python3 apply_registration_imports_patch.py
          python3 apply_driver_menu_patch.py
          python3 apply_franchise_selection_patch.py
          python3 apply_prime_driver_patch.py
          python3 apply_document_upload_patch.py
          python3 apply_driver_doc_rpc_patch.py
          python3 apply_vehicle_type_validation_patch.py
          python3 apply_location_heartbeat_patch.py
          python3 apply_session_refresh_patch_v2.py
          python3 apply_driver_passenger_navigation_v14.py
          python3 apply_driver_navigation_fallback_v15.py
          python3 apply_driver_arrival_wait_v16.py
          python3 apply_full_route_history_v17.py
          python3 apply_driver_safety_v18.py
          python3 apply_driver_taximeter_v19.py
          python3 apply_driver_taximeter_v19_fix.py
          python3 apply_driver_push_v20.py
          python3 apply_driver_taximeter_finance_v21.py
          python3 apply_driver_flow_v22.py
          python3 apply_driver_login_sound_bubble_v23.py
          python3 apply_driver_v23_registration_restore.py
          python3 apply_driver_commercial_ui_v24.py
          python3 apply_driver_rating_v25.py
          python3 apply_driver_clean_menu_v26.py
          python3 apply_driver_offer_popup_wallet_eye_v27.py
          python3 apply_driver_sober_ui_v28.py
      - name: Build native driver APK
        working-directory: android-native/motorista
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p apk-output
          cp android-native/motorista/app/build/outputs/apk/debug/app-debug.apk apk-output/CLICK-GO-Motorista-native-v2.8-prime.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CLICK-GO-Motorista-native-v2.8-prime
          path: apk-output/CLICK-GO-Motorista-native-v2.8-prime.apk
          if-no-files-found: error

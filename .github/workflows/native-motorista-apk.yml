name: Native Motorista APK

on:
  push:
    branches: [main]
    paths:
      - 'android-native/motorista/**'
      - '.github/workflows/native-motorista-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-native/motorista/**'
      - '.github/workflows/native-motorista-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare preview signing key
        run: |
          base64 -d android-native/motorista/app/preview-debug.keystore.b64 > android-native/motorista/app/preview-debug.keystore
      - name: Apply driver v0.6 features
        working-directory: android-native/motorista
        run: |
          python3 apply_login_stability_patch.py
          python3 apply_recovery_routing_patch.py
          python3 apply_registration_photo_patch.py
          python3 apply_registration_imports_patch.py
          python3 apply_driver_menu_patch.py
          python3 apply_franchise_selection_patch.py
      - name: Build native driver APK
        working-directory: android-native/motorista
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p apk-output
          cp android-native/motorista/app/build/outputs/apk/debug/app-debug.apk apk-output/CLICK-GO-Motorista-native-v0.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CLICK-GO-Motorista-native-v0.6
          path: apk-output/CLICK-GO-Motorista-native-v0.6.apk
          if-no-files-found: error

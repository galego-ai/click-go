name: Android Preview APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-preview-apks
    paths:
      - 'android-preview/**'
      - '.github/workflows/android-preview-apks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-preview/**'
      - '.github/workflows/android-preview-apks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Passenger and Driver APKs
        working-directory: android-preview
        run: gradle --no-daemon :app:assemblePassageiroDebug :app:assembleMotoristaDebug

      - name: Rename APKs
        run: |
          mkdir -p apk-output
          cp android-preview/app/build/outputs/apk/passageiro/debug/app-passageiro-debug.apk apk-output/CLICK-GO-Passageiro-preview.apk
          cp android-preview/app/build/outputs/apk/motorista/debug/app-motorista-debug.apk apk-output/CLICK-GO-Motorista-preview.apk

      - name: Upload Passenger APK
        uses: actions/upload-artifact@v4
        with:
          name: CLICK-GO-Passageiro-preview
          path: apk-output/CLICK-GO-Passageiro-preview.apk
          if-no-files-found: error

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: CLICK-GO-Motorista-preview
          path: apk-output/CLICK-GO-Motorista-preview.apk
          if-no-files-found: error

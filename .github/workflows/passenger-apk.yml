name: Passenger APK Build

on:
  push:
    branches:
      - feature/passenger-app
    paths:
      - 'apps/passenger/**'
      - '.github/workflows/passenger-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GOOGLE_MAPS_PASSENGER_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_PASSENGER_ANDROID_KEY }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/passenger
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/passenger-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/passenger/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - id: install
        name: Install dependencies
        continue-on-error: true
        run: npm install
      - id: prebuild
        name: Expo prebuild
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx expo prebuild --platform android --non-interactive
      - id: gradle
        name: Build debug APK
        if: steps.prebuild.outcome == 'success'
        continue-on-error: true
        working-directory: apps/passenger/android
        run: ./gradlew assembleDebug
      - id: collect
        name: Collect APK
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        run: cp android/app/build/outputs/apk/debug/app-debug.apk click-go-passageiro-teste.apk
      - name: Upload APK artifact
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: click-go-passageiro-teste
          path: apps/passenger/click-go-passageiro-teste.apk
          if-no-files-found: error
      - name: Persist build result
        if: always()
        working-directory: .
        run: |
          mkdir -p artifacts
          printf 'install=%s\nprebuild=%s\ngradle=%s\ncollect=%s\n' '${{ steps.install.outcome }}' '${{ steps.prebuild.outcome }}' '${{ steps.gradle.outcome }}' '${{ steps.collect.outcome }}' > artifacts/passenger-apk-status.txt
          if [ -f apps/passenger/click-go-passageiro-teste.apk ]; then
            cp apps/passenger/click-go-passageiro-teste.apk artifacts/click-go-passageiro-teste.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/passenger-apk-status.txt
          if [ -f artifacts/click-go-passageiro-teste.apk ]; then git add artifacts/click-go-passageiro-teste.apk; fi
          git commit -m "build: persist passenger APK result" || exit 0
          git push origin HEAD:feature/passenger-app

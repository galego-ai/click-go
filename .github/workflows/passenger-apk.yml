name: Passenger APK Build

on:
  push:
    branches:
      - feature/passenger-app
    paths:
      - 'apps/passenger/**'
      - '.github/workflows/passenger-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GOOGLE_MAPS_PASSENGER_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_PASSENGER_ANDROID_KEY }}
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NODE_OPTIONS: --max-old-space-size=4096
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/passenger
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/passenger-app
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/passenger/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Validate public app configuration
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
      - id: install
        name: Install dependencies
        continue-on-error: true
        run: npm install
      - name: Dependency diagnostics
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          {
            echo "build_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            npm ls expo react-native expo-modules-core react-native-reanimated react-native-worklets --all || true
          } | tee dependency-diagnostics.log
      - id: typecheck
        name: Typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx tsc --noEmit
      - id: prebuild
        name: Expo prebuild
        if: steps.typecheck.outcome == 'success'
        continue-on-error: true
        run: npx expo prebuild --platform android --non-interactive
      - id: gradle_config
        name: Configure Gradle memory
        if: steps.prebuild.outcome == 'success'
        continue-on-error: true
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\norg.gradle.parallel=false\n' >> android/gradle.properties
      - name: Runner memory diagnostics
        if: steps.gradle_config.outcome == 'success'
        run: |
          echo "NODE_OPTIONS=$NODE_OPTIONS"
          echo "GRADLE_OPTS=$GRADLE_OPTS"
          free -h
      - id: gradle
        name: Build standalone release APK
        if: steps.gradle_config.outcome == 'success'
        continue-on-error: true
        working-directory: apps/passenger/android
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace 2>&1 | tee ../gradle-build.log
      - id: verify
        name: Verify JavaScript bundle inside APK
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
      - id: collect
        name: Collect APK
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: cp android/app/build/outputs/apk/release/app-release.apk click-go-passageiro-teste.apk
      - name: Upload APK artifact
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: click-go-passageiro-teste
          path: apps/passenger/click-go-passageiro-teste.apk
          if-no-files-found: error
      - name: Persist build diagnostics
        if: always()
        working-directory: .
        run: |
          mkdir -p artifacts
          printf 'build_sha=%s\nrun_id=%s\nbuilt_at=%s\ninstall=%s\ntypecheck=%s\nprebuild=%s\ngradle_config=%s\ngradle=%s\nverify=%s\ncollect=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '${{ steps.install.outcome }}' '${{ steps.typecheck.outcome }}' '${{ steps.prebuild.outcome }}' '${{ steps.gradle_config.outcome }}' '${{ steps.gradle.outcome }}' '${{ steps.verify.outcome }}' '${{ steps.collect.outcome }}' > artifacts/passenger-apk-status.txt
          if [ -f apps/passenger/dependency-diagnostics.log ]; then cp apps/passenger/dependency-diagnostics.log artifacts/passenger-dependency-diagnostics.log; fi
          if [ -f apps/passenger/gradle-build.log ]; then tail -n 300 apps/passenger/gradle-build.log > artifacts/passenger-gradle-error.log; fi
          if [ -f apps/passenger/click-go-passageiro-teste.apk ]; then cp apps/passenger/click-go-passageiro-teste.apk artifacts/click-go-passageiro-teste.apk; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/passenger-apk-status.txt
          if [ -f artifacts/passenger-dependency-diagnostics.log ]; then git add artifacts/passenger-dependency-diagnostics.log; fi
          if [ -f artifacts/passenger-gradle-error.log ]; then git add artifacts/passenger-gradle-error.log; fi
          if [ -f artifacts/click-go-passageiro-teste.apk ]; then git add artifacts/click-go-passageiro-teste.apk; fi
          git commit -m "build: persist passenger APK diagnostics for $GITHUB_SHA" || exit 0
          git pull --rebase origin feature/passenger-app || true
          git push origin HEAD:feature/passenger-app || true

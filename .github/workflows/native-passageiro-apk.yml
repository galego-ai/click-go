name: Native Passageiro APK

on:
  push:
    branches: [main]
    paths:
      - 'android-native/passageiro/**'
      - 'src/app/api/geocode/**'
      - 'src/app/api/google-places/**'
      - 'src/app/api/route/**'
      - '.github/workflows/native-passageiro-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-native/passageiro/**'
      - 'src/app/api/geocode/**'
      - 'src/app/api/google-places/**'
      - 'src/app/api/route/**'
      - '.github/workflows/native-passageiro-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLICKGO_FIREBASE_PROJECT_ID: ${{ secrets.CLICKGO_FIREBASE_PROJECT_ID }}
      CLICKGO_FIREBASE_APP_ID: ${{ secrets.CLICKGO_FIREBASE_PASSENGER_APP_ID }}
      CLICKGO_FIREBASE_API_KEY: ${{ secrets.CLICKGO_FIREBASE_API_KEY }}
      CLICKGO_FIREBASE_SENDER_ID: ${{ secrets.CLICKGO_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare preview signing key
        run: |
          base64 -d android-native/passageiro/app/preview-debug.keystore.b64 > android-native/passageiro/app/preview-debug.keystore
      - name: Apply passenger PRIME features
        working-directory: android-native/passageiro
        run: |
          python3 apply_avatar_patch.py
          python3 apply_route_profile_patch.py
          python3 apply_login_stability_patch.py
          python3 apply_recovery_routing_patch.py
          python3 apply_anr_stability_patch.py
          python3 apply_destination_marker_patch.py
          python3 apply_drag_avatar_picker_patch.py
          python3 apply_functional_menu_patch.py
          python3 apply_map_places_satellite_patch.py
          python3 apply_profile_photo_cpf_lock_patch.py
          python3 apply_prime_realtime_patch.py
          python3 apply_prime_route_helpers_fix.py
          python3 apply_home_map_categories_fix.py
          python3 apply_address_crash_stability_patch_v3.py
          python3 apply_session_refresh_patch.py
          python3 apply_category_crash_fix_v23.py
          python3 apply_passenger_stable_v24_patch.py
          python3 apply_passenger_stable_dispatch_v25.py
          python3 apply_passenger_stable_dispatch_v25_compile_fix.py
          python3 apply_driver_card_wait_tracking_v26.py
          python3 apply_full_route_history_v27.py
          python3 apply_passenger_safety_v28.py
          python3 apply_passenger_push_v29.py
          python3 apply_passenger_push_v210_fix.py
          python3 apply_passenger_live_route_v211.py
          python3 apply_passenger_v212_compat.py
          python3 apply_passenger_commercial_ui_v212.py
          python3 apply_passenger_mapbox_safe_ui_v213.py
          python3 apply_passenger_v214_history_compat.py
          python3 apply_passenger_live_ux_v214.py
          python3 apply_passenger_v214_compile_fix.py
          python3 apply_passenger_history_address_fix_v214.py
          python3 apply_passenger_chat_v215.py
          python3 apply_passenger_active_flow_address_v216.py
          python3 apply_passenger_address_threshold_fix_v216.py
          python3 apply_passenger_v216_compile_fix.py
          python3 apply_passenger_anr_hotfix_v217.py
          python3 apply_passenger_map_layout_anr_fix_v218.py
          python3 apply_passenger_accept_ui_v219.py
          python3 apply_passenger_accept_transition_v219.py
          python3 apply_passenger_accept_smoke_transition_v219.py
          python3 apply_passenger_relaunch_history_v220.py
          python3 apply_passenger_v220_compile_fix.py
          python3 apply_passenger_home_ads_v221.py
          python3 apply_passenger_fast_address_search_v222.py
          python3 apply_passenger_webview_crash_shield_v223.py
          grep -q "get_active_app_banners" app/src/main/java/com/clickgo/passageiro/MainActivity.java
          grep -q "onRenderProcessGone" app/src/main/java/com/clickgo/passageiro/PassengerHomeMap.java
          grep -q "onRenderProcessGone" app/src/main/java/com/clickgo/passageiro/PassengerLiveMap.java
          grep -q "clickgo_home_network_smoke" app/src/main/java/com/clickgo/passageiro/MainActivity.java
          grep -q "clickgo_address_network_smoke" app/src/main/java/com/clickgo/passageiro/MainActivity.java
          grep -q "nativeAddressFallback" app/src/main/java/com/clickgo/passageiro/MainActivity.java
          grep -q "clickgo_search_on_map" app/src/main/java/com/clickgo/passageiro/MainActivity.java
      - name: Build native passenger APK
        working-directory: android-native/passageiro
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        if: github.event_name == 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Accepted ride responsiveness test
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r android-native/passageiro/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.clickgo.passageiro.beta/com.clickgo.passageiro.MainActivity --ez clickgo_tracking_smoke true | tee /tmp/start.txt
            grep -q "Status: ok" /tmp/start.txt
            sleep 9
            timeout 20 adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/window.xml
            grep -q "Motorista a caminho" /tmp/window.xml
            grep -q "CANCELAR CORRIDA" /tmp/window.xml
            grep -q "Motorista teste" /tmp/window.xml
            adb shell input swipe 500 1300 500 850 300
            sleep 2
            timeout 20 adb shell uiautomator dump /sdcard/window2.xml
            adb pull /sdcard/window2.xml /tmp/window2.xml
            grep -q "Motorista a caminho" /tmp/window2.xml
            ! adb logcat -d | grep -E "ANR in com.clickgo.passageiro.beta|FATAL EXCEPTION: main|Input dispatching timed out"
            adb shell pidof com.clickgo.passageiro.beta >/dev/null
      - name: Home clear-and-reopen stability test
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r android-native/passageiro/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.clickgo.passageiro.beta/com.clickgo.passageiro.MainActivity --ez clickgo_home_smoke true | tee /tmp/home1.txt
            grep -q "Status: ok" /tmp/home1.txt
            sleep 6
            timeout 20 adb shell uiautomator dump /sdcard/home1.xml
            adb pull /sdcard/home1.xml /tmp/home1.xml
            test -s /tmp/home1.xml
            adb shell pidof com.clickgo.passageiro.beta >/dev/null
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell am start -W -n com.clickgo.passageiro.beta/com.clickgo.passageiro.MainActivity --ez clickgo_home_smoke true | tee /tmp/home2.txt
            grep -q "Status: ok" /tmp/home2.txt
            sleep 10
            timeout 20 adb shell uiautomator dump /sdcard/home2.xml
            adb pull /sdcard/home2.xml /tmp/home2.xml
            test -s /tmp/home2.xml
            ! adb logcat -d | grep -E "ANR in com.clickgo.passageiro.beta|FATAL EXCEPTION: main|Input dispatching timed out"
            adb shell pidof com.clickgo.passageiro.beta >/dev/null
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb logcat -c
            adb shell am start -W -n com.clickgo.passageiro.beta/com.clickgo.passageiro.MainActivity --ez clickgo_home_network_smoke true | tee /tmp/home-network.txt
            grep -q "Status: ok" /tmp/home-network.txt
            sleep 12
            timeout 20 adb shell uiautomator dump /sdcard/home-network.xml
            adb pull /sdcard/home-network.xml /tmp/home-network.xml
            test -s /tmp/home-network.xml
            ! adb logcat -d | grep -E "ANR in com.clickgo.passageiro.beta|FATAL EXCEPTION: main|Input dispatching timed out"
            adb shell pidof com.clickgo.passageiro.beta >/dev/null
            adb shell am force-stop com.clickgo.passageiro.beta
            adb logcat -c
            adb shell am start -W -n com.clickgo.passageiro.beta/com.clickgo.passageiro.MainActivity --ez clickgo_address_network_smoke true | tee /tmp/address-network.txt
            grep -q "Status: ok" /tmp/address-network.txt
            sleep 15
            timeout 20 adb shell uiautomator dump /sdcard/address-network.xml
            adb pull /sdcard/address-network.xml /tmp/address-network.xml
            grep -q "clickgo_search_on_map" /tmp/address-network.xml
            grep -q "endereco_resultado_1" /tmp/address-network.xml
            ! adb logcat -d | grep -E "ANR in com.clickgo.passageiro.beta|FATAL EXCEPTION: main|Input dispatching timed out"
            adb shell pidof com.clickgo.passageiro.beta >/dev/null
      - name: Prepare artifact
        run: |
          mkdir -p apk-output
          cp android-native/passageiro/app/build/outputs/apk/debug/app-debug.apk apk-output/CLICK-GO-Passageiro-native-v2.25-prime.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CLICK-GO-Passageiro-native-v2.25-prime
          path: apk-output/CLICK-GO-Passageiro-native-v2.25-prime.apk
          if-no-files-found: error

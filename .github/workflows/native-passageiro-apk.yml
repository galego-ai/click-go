name: Native Passageiro APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-native/passageiro/**'
      - 'src/app/api/geocode/**'
      - '.github/workflows/native-passageiro-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare preview signing key
        run: |
          base64 -d android-native/passageiro/app/preview-debug.keystore.b64 > android-native/passageiro/app/preview-debug.keystore
      - name: Apply passenger v1.1 features
        working-directory: android-native/passageiro
        run: |
          python3 apply_avatar_patch.py
          python3 apply_route_profile_patch.py
          python3 apply_login_stability_patch.py
          python3 apply_recovery_routing_patch.py
          python3 apply_anr_stability_patch.py
      - name: Build native passenger APK
        working-directory: android-native/passageiro
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p apk-output
          cp android-native/passageiro/app/build/outputs/apk/debug/app-debug.apk apk-output/CLICK-GO-Passageiro-native-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CLICK-GO-Passageiro-native-v1.1
          path: apk-output/CLICK-GO-Passageiro-native-v1.1.apk
          if-no-files-found: error
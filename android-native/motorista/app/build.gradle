        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1-native-beta'
        buildConfigField 'String', 'SUPABASE_URL', '"https://kyaewidapnggmhbsrqch.supabase.co"'
        buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_kvZR2g8wzx9MDIhgkRaMfw_wzujQvBt"'
    }

    signingConfigs {
        preview {
            storeFile file('preview-debug.keystore')
            storePassword 'clickgo-preview'
            keyAlias 'clickgo-driver-preview'
